name: Deploy documentation artifacts
description: Deploy documentation artifacts

inputs:
  S3_BUCKET:
    description: S3 bucket name
    required: true
  CLOUDFRONT_ID:
    description: Cloudfront distribution ID
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm i
      shell: bash
    - name: Build framework
      run: npm run build
      shell: bash
    # Assets are content-hashed, so they can be cached forever. Everything
    # else (HTML, favicons, sitemap) keeps a short TTL so a deploy is picked up
    # quickly. Without an explicit Cache-Control, S3 sends none at all and
    # browsers fall back to heuristic caching.
    - name: Upload hashed assets to S3
      run: |
        aws s3 sync src/.vuepress/dist ${{ inputs.S3_BUCKET }} \
          --exclude "*" --include "assets/*" \
          --cache-control "public, max-age=31536000, immutable"
      shell: bash
    - name: Upload the rest to S3
      run: |
        aws s3 sync src/.vuepress/dist ${{ inputs.S3_BUCKET }} \
          --exclude "assets/*" \
          --cache-control "public, max-age=300, must-revalidate"
      shell: bash
